name: Build and Release

# Builds the Windows installer and portable package with jpackage and attaches
# them to a GitHub release. Triggered by pushing a tag such as v3.0.0.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: 'trackhounds/pom.xml'

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Set project version
        shell: bash
        working-directory: trackhounds
        run: ./mvnw -B versions:set -DnewVersion="${{ steps.version.outputs.VERSION }}" -DgenerateBackupPoms=false

      # WiX Toolset 3.x (required by jpackage for .exe/.msi installers) is preinstalled on windows-latest.
      - name: Build application, app image and installer
        shell: bash
        working-directory: trackhounds
        run: ./mvnw -B clean package -DskipTests -Papp-image,win-installer

      - name: Create portable zip
        shell: pwsh
        working-directory: trackhounds/target/dist
        run: Compress-Archive -Path TrackHounds -DestinationPath "TrackHounds-${{ steps.version.outputs.VERSION }}-win-portable.zip"

      - name: List artifacts
        shell: bash
        run: ls -la trackhounds/target/dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "TrackHounds ${{ steps.version.outputs.VERSION }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## TrackHounds ${{ steps.version.outputs.VERSION }}

            ## [User Guide](https://github.com/hctynch/trackhounds/blob/main/README.md)

            ### Download Instructions (Windows)

            - **Installer**: download `TrackHounds-${{ steps.version.outputs.VERSION }}.exe` and run it.
              Windows SmartScreen may warn that the publisher is unknown: click *More info* then *Run anyway*.
              The installer upgrades an existing installation in place and keeps your data.
            - **Portable**: download `TrackHounds-${{ steps.version.outputs.VERSION }}-win-portable.zip`,
              extract it anywhere and run `TrackHounds\TrackHounds.exe`.

            No Docker, Java or internet connection is required. Data is stored in `%LOCALAPPDATA%\TrackHounds`.
          files: |
            trackhounds/target/dist/TrackHounds-${{ steps.version.outputs.VERSION }}.exe
            trackhounds/target/dist/TrackHounds-${{ steps.version.outputs.VERSION }}-win-portable.zip
            trackhounds/target/trackhounds-${{ steps.version.outputs.VERSION }}.jar
