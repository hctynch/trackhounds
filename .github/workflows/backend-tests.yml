name: Build and Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # JDK 25 (LTS): the JavaFX 26 window needs at least Java 24 class files.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
          cache-dependency-path: 'trackhounds/pom.xml'

      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            trackhounds/.node
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}

      # Builds the React UI, bundles it into the jar and runs the test suite against SQLite.
      # No database server or Docker is needed.
      - name: Build and test
        run: ./mvnw -B clean verify
        working-directory: trackhounds

      # Starts the built jar twice against an empty data folder: endpoints answer, the UI and the
      # CSV template are served, the schema is created on the first start and found current on the second.
      - name: Smoke test the jar
        run: bash .github/scripts/smoke.sh trackhounds/target/trackhounds-*.jar

      - name: Upload JaCoCo Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: trackhounds/target/site/jacoco/jacoco.xml
          fail_ci_if_error: false
          verbose: true

      - name: Upload Coverage Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: trackhounds/target/site/jacoco/

      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: trackhounds-jar
          path: trackhounds/target/trackhounds-*.jar
