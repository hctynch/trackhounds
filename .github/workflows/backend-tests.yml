name: Build and Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: 'trackhounds/pom.xml'

      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            trackhounds/target/node
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}

      # Builds the React UI, bundles it into the jar and runs the test suite against SQLite.
      # No database server or Docker is needed.
      - name: Build and test
        run: ./mvnw -B clean verify
        working-directory: trackhounds

      - name: Upload JaCoCo Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: trackhounds/target/site/jacoco/jacoco.xml
          fail_ci_if_error: false
          verbose: true

      - name: Upload Coverage Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: trackhounds/target/site/jacoco/

      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: trackhounds-jar
          path: trackhounds/target/trackhounds-*.jar
