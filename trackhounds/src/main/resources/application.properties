spring.application.name=trackhounds

# ---------------------------------------------------------------------------
# Data directory
# ---------------------------------------------------------------------------
# All user data (database, logs, browser profile) lives in one folder so it is
# easy to back up. The default is resolved by DataDirectoryEnvironmentPostProcessor:
#   Windows : %LOCALAPPDATA%\TrackHounds
#   macOS   : ~/Library/Application Support/TrackHounds
#   Linux   : $XDG_DATA_HOME/TrackHounds (or ~/.local/share/TrackHounds)
# Override with -Dtrackhounds.data-dir=<path> or the TRACKHOUNDS_DATA_DIR env var.
#trackhounds.data-dir=

# ---------------------------------------------------------------------------
# Database: a single SQLite file, no server, no network.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:sqlite:${trackhounds.data-dir}/trackhounds.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows one writer at a time; a single pooled connection serialises access
# and avoids "database is locked" errors from concurrent requests.
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.data-source-properties.journal_mode=WAL
spring.datasource.hikari.data-source-properties.synchronous=NORMAL
spring.datasource.hikari.data-source-properties.busy_timeout=10000

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
# The services work on one persistence context per request (entities stay managed across
# repository calls). Keep Open-Session-In-View on; the tests rely on the same behaviour via @Transactional.
spring.jpa.open-in-view=true

# ---------------------------------------------------------------------------
# Web server: bind to loopback only; the desktop launcher picks a free port.
# ---------------------------------------------------------------------------
server.address=127.0.0.1
server.port=${trackhounds.port:0}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5s

# ---------------------------------------------------------------------------
# Desktop launcher (system tray icon + application window)
# ---------------------------------------------------------------------------
trackhounds.desktop.enabled=true
trackhounds.desktop.preferred-port=8080

# ---------------------------------------------------------------------------
# Actuator (used by the UI health check and the launcher)
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.build.enabled=true

# ---------------------------------------------------------------------------
# Logging: the packaged app has no console, so log to a rolling file too.
# ---------------------------------------------------------------------------
logging.file.name=${trackhounds.data-dir}/logs/trackhounds.log
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=5
logging.level.root=INFO
logging.level.org.hibernate.orm.deprecation=ERROR
