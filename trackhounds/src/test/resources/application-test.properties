spring.application.name=trackhounds

# Tests run against a throw-away SQLite file under target/ (no database server needed).
trackhounds.data-dir=${project.build.directory:target}/test-data
spring.datasource.url=jdbc:sqlite:${trackhounds.data-dir}/trackhounds-test.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.data-source-properties.journal_mode=WAL
spring.datasource.hikari.data-source-properties.busy_timeout=10000

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Never open windows or tray icons during tests.
trackhounds.desktop.enabled=false
server.port=0

logging.file.name=
logging.level.org.hibernate.orm.deprecation=ERROR
